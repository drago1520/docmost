# Coolify: Docker Compose build pack, pointed at this repo. Builds the fork
# from the Dockerfile instead of pulling docmost/docmost:latest.
services:
  docmost:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SERVICE_URL_DOCMOST_3000
      - APP_SECRET=$SERVICE_BASE64_APPKEY
      # Coolify shows SERVICE_URL_DOCMOST_3000 but does not inject it for
      # git-built compose apps, so set APP_URL in Environment Variables.
      - APP_URL=${APP_URL}
      - 'DATABASE_URL=postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgresql/docmost?schema=public'
      - 'REDIS_URL=redis://redis:6379'
      - 'MAIL_DRIVER=${MAIL_DRIVER:-smtp}'
      - 'SMTP_HOST=${SMTP_HOST}'
      - 'SMTP_PORT=${SMTP_PORT}'
      - 'SMTP_USERNAME=${SMTP_USERNAME}'
      - 'SMTP_PASSWORD=${SMTP_PASSWORD}'
      - 'SMTP_SECURE=${SMTP_SECURE}'
      - 'MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}'
      - 'MAIL_FROM_NAME=${MAIL_FROM_NAME}'
      - 'POSTMARK_TOKEN=${POSTMARK_TOKEN}'
    volumes:
      - 'docmost:/app/data/storage'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000']
      interval: 2s
      timeout: 10s
      retries: 20
  postgresql:
    image: 'postgres:18'
    environment:
      - POSTGRES_USER=$SERVICE_USER_POSTGRES
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_DB=docmost
    volumes:
      - 'postgresql-data:/var/lib/postgresql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 10s
      retries: 20
  redis:
    image: 'redis:8'
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - 'redis-data:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'PING']
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  docmost:
  postgresql-data:
  redis-data:
